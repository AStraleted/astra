<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HUB — Главная</title>
<style>
  :root {
    /* ---------- палитра Cloud Traffic ---------- */
    --canvas: #000000;
    --bg-sidebar: #0F0F0F;
    --card: #0F0F0F;
    --card-hover: #141414;
    --nav-active: #121C2C;
    --border: #1D1D1D;
    --divider: #1E1E1E;
    --text: #FFFFFF;
    --text-2: #989898;
    --text-3: #606060;
    --accent: #2B7FFF;
    --green: #22C55E;
    --radius: 16px;
    --radius-sm: 12px;
    /* современная кривая: мгновенный отклик, тихое затухание — без пружин и bounce */
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: var(--canvas);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-weight: 400;
    letter-spacing: -0.005em;
  }

  .app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--canvas);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- сайдбар (десктоп, на телефоне скрыт) ---------- */
  .sidebar { display: none; }
  .profile-meta { display: flex; flex-direction: column; align-items: center; }
  .icon-btn.desktop-extra { display: none; }

  /* шапка сайдбара: логотип + пин */
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 8px 0;
  }
  .side-logo { display: flex; align-items: center; gap: 9px; }
  .side-logo .lg {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .side-pin {
    background: none; border: none; cursor: pointer;
    color: var(--text-3); padding: 6px; border-radius: 8px;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .side-pin:hover { color: var(--text-2); background: var(--card-hover); }
  .side-pin svg { width: 15px; height: 15px; display: block; }

  /* пользователь по центру */
  .side-user {
    display: flex; flex-direction: column; align-items: center;
    gap: 9px;
    padding: 22px 0 18px;
  }
  .side-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #1B438D;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500;
  }
  .side-username { font-size: 14px; font-weight: 500; }

  /* карточка Mini App с тумблером */
  .side-miniapp {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-hover);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 0 2px 16px;
  }
  .mini-icon {
    width: 32px; height: 32px; flex: none;
    border-radius: 8px;
    background: #121924;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mini-icon svg { width: 15px; height: 15px; }
  .mini-title { font-size: 13px; font-weight: 500; }
  .mini-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .side-miniapp .switch { margin-left: auto; }

  /* тумблер */
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: #2A2A2A;
    transition: background .2s var(--ease);
    cursor: pointer;
  }
  .switch span::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s var(--ease);
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }

  /* меню */
  .side-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; position: relative; }
  /* скользящая подложка активного пункта */
  .side-glider {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 40px;
    border-radius: 10px;
    background: var(--nav-active);
    transform: translateY(0);
    transition: transform .3s var(--ease), height .3s var(--ease), opacity .25s var(--ease);
    z-index: 0;
    pointer-events: none;
  }
  .side-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    background: none; border: none; cursor: pointer;
    color: var(--text-3);
    font-family: inherit; font-size: 14px; font-weight: 500;
    text-align: left;
    position: relative;
    z-index: 1;
    transition: color .2s var(--ease);
  }
  .side-item svg { width: 18px; height: 18px; transition: color .2s var(--ease); }
  .side-item:hover { color: var(--text-2); }
  .side-item.active { color: var(--text); }
  .side-item.active svg { color: var(--accent); }

  /* бейджи NEW / BETA / СКОРО */
  .badge {
    margin-left: auto;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em;
    padding: 3px 6px;
    border-radius: 5px;
    text-transform: uppercase;
  }
  .badge--new { color: var(--accent); background: #121924; }
  .badge--soon { color: #F59E0B; background: #20190F; }

  /* аккаунт внизу сайдбара */
  .side-account {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--border);
    padding: 13px 4px 2px;
    min-width: 0;
  }
  .acc-avatar {
    width: 32px; height: 32px; flex: none;
    border-radius: 50%;
    background: #F35F5F;
    color: #fff;
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .acc-info { min-width: 0; flex: 1; }
  .acc-mail {
    font-size: 12px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .acc-plan { font-size: 10px; color: var(--accent); margin-top: 1px; }
  .side-account .icon-btn { width: 30px; height: 30px; border: none; flex: none; }
  .side-account .icon-btn svg { width: 15px; height: 15px; }

  /* планшет: мобильная колонка по центру */
  @media (min-width: 481px) and (max-width: 899px) {
    .app {
      max-width: 480px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .nav { max-width: 480px; }
  }

  /* ---------- десктоп ---------- */
  @media (min-width: 900px) {
    .app { flex-direction: row; }
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 264px;
      flex: none;
      position: sticky;
      top: 12px;
      height: calc(100vh - 24px);
      height: calc(100dvh - 24px);
      margin: 12px 0 12px 12px;
      padding: 18px 12px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      white-space: nowrap;
      transition: width .3s var(--ease);
    }
    /* свёрнутое состояние по умолчанию: узкая пилюля с иконками.
       ширина анимируется, подписи просто клипаются (overflow: hidden + nowrap) */
    .sidebar.collapsed { width: 76px; }
    .sidebar.collapsed .side-logo .brand,
    .sidebar.collapsed .side-username,
    .sidebar.collapsed .mini-title,
    .sidebar.collapsed .mini-sub,
    .sidebar.collapsed .switch,
    .sidebar.collapsed .side-item span,
    .sidebar.collapsed .badge,
    .sidebar.collapsed .acc-info,
    .sidebar.collapsed .side-account .icon-btn {
      opacity: 0;
      transition: opacity .15s var(--ease);
    }
    /* наведение — плавно разворачиваем; pinned — закреплено открытым */
    .sidebar.collapsed:hover,
    .sidebar.collapsed.pinned { width: 264px; }
    .sidebar.collapsed:hover .side-logo .brand,
    .sidebar.collapsed:hover .side-username,
    .sidebar.collapsed:hover .mini-title,
    .sidebar.collapsed:hover .mini-sub,
    .sidebar.collapsed:hover .switch,
    .sidebar.collapsed:hover .side-item span,
    .sidebar.collapsed:hover .badge,
    .sidebar.collapsed:hover .acc-info,
    .sidebar.collapsed:hover .side-account .icon-btn,
    .sidebar.collapsed.pinned .side-logo .brand,
    .sidebar.collapsed.pinned .side-username,
    .sidebar.collapsed.pinned .mini-title,
    .sidebar.collapsed.pinned .mini-sub,
    .sidebar.collapsed.pinned .switch,
    .sidebar.collapsed.pinned .side-item span,
    .sidebar.collapsed.pinned .badge,
    .sidebar.collapsed.pinned .acc-info,
    .sidebar.collapsed.pinned .side-account .icon-btn {
      opacity: 1;
      transition: opacity .2s var(--ease) .12s;
    }
    .nav { display: none; }
    .content {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 44px 48px 72px;
    }
    .topbar { padding-top: 0; justify-content: flex-end; }
    .topbar .brand { display: none; }
    .profile {
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 12px 0 30px;
    }
    .avatar-wrap { margin-bottom: 0; }
    .avatar { width: 56px; height: 56px; font-size: 20px; }
    .profile-meta { align-items: flex-start; }
    .trust { margin: 0 0 0 auto; }
    .rows { display: grid; grid-template-columns: 1fr 1fr; }
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 20px calc(96px + env(safe-area-inset-bottom));
  }

  /* узкие телефоны */
  @media (max-width: 360px) {
    .content { padding: 0 14px calc(96px + env(safe-area-inset-bottom)); }
    .balance-total .sum { font-size: 30px; }
    .profile { padding: 22px 0 20px; }
  }

  /* верхняя зона под вырез/чёлку телефона */
  .topbar { padding-top: calc(20px + env(safe-area-inset-top)); }

  /* иконки Lucide: размер через CSS, цвет через currentColor */
  svg.ic { display: block; flex: none; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 4px;
  }
  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.18em;
  }
  .brand span { color: var(--accent); }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .icon-btn:hover { background: var(--card); color: var(--text); }
  .icon-btn:active { background: var(--card-hover); transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .dot {
    position: absolute;
    top: 8px; right: 9px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--canvas);
  }

  /* ---------- profile ---------- */
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 0 26px;
  }
  .avatar-wrap { position: relative; margin-bottom: 14px; }
  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    font-weight: 300;
  }
  .online {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--green);
    border: 3px solid var(--canvas);
  }
  .profile-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .verified {
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    flex: none;
  }
  .verified svg { width: 18px; height: 18px; }
  .profile-handle {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 300;
    color: var(--text-3);
  }
  /* ---------- TRUST badge (как Trust Factor в CS2) ---------- */
  .trust {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 10px;
    border: 1px solid;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .trust svg { width: 13px; height: 13px; }
  .trust .t-sep {
    width: 1px;
    height: 12px;
    background: currentColor;
    opacity: 0.35;
  }
  .trust .t-score { letter-spacing: 0.04em; }

  .trust--green {
    color: #22C55E;
    background: #112518;
    border-color: rgba(34,197,94,0.35);
  }
  .trust--yellow {
    color: #F59E0B;
    background: #20190F;
    border-color: rgba(245,158,11,0.32);
  }
  .trust--red {
    color: #F35F5F;
    background: rgba(243,95,95,0.10);
    border-color: rgba(243,95,95,0.35);
  }

  /* ---------- unified balance card ---------- */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .balance-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 0;
  }
  .label {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .label-tag {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--text-3);
  }

  .balance-total {
    padding: 14px 18px 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .balance-total .sum {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .balance-total .cur {
    font-size: 15px;
    font-weight: 300;
    color: var(--text-3);
  }

  .balance-list { padding: 0 8px 8px; }
  .b-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border-radius: var(--radius-sm);
    border-top: 1px solid var(--divider);
    cursor: pointer;
    transition: background .2s var(--ease);
  }
  .b-row:first-child { border-top: none; }
  .b-row:hover { background: var(--card-hover); }
  .b-row:active { background: var(--card-hover); }
  .b-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .b-icon svg { width: 16px; height: 16px; }
  .b-name { flex: 1; font-size: 14.5px; font-weight: 400; }
  .b-value {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .b-value small { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 1px; }
  .b-open {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-left: 10px;
  }
  .b-open svg { width: 13px; height: 13px; }

  /* ---------- CTA ---------- */
  .cta {
    margin-top: 14px;
    width: 100%;
    border: none;
    border-radius: var(--radius);
    padding: 17px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #0A0A0B;
    background: #FFFFFF;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .cta:hover { opacity: 0.93; }
  .cta:active { opacity: 0.85; transform: scale(0.98); }
  .cta svg { width: 18px; height: 18px; stroke-width: 2.4; }

  /* ---------- quick actions ---------- */
  .quick {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .quick-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  .quick-btn:hover { background: var(--card-hover); border-color: #262626; }
  .quick-btn:active { background: var(--card-hover); transform: scale(0.97); }
  .quick-btn .q-icon {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
  }
  .quick-btn svg { width: 14px; height: 14px; }

  /* ---------- list rows ---------- */
  .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  .row:hover { background: var(--card-hover); border-color: #262626; }
  .row:active { background: var(--card-hover); transform: scale(0.985); }
  .row-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: rgba(255,255,255,0.05);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .row-icon svg { width: 18px; height: 18px; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 15px; font-weight: 500; }
  .row-sub { font-size: 12.5px; font-weight: 300; color: var(--text-3); margin-top: 3px; }
  .row-chevron { color: var(--text-3); flex: none; display: flex; }
  .row-chevron svg { width: 17px; height: 17px; }

  /* ---------- bottom nav ---------- */
  .nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    z-index: 10;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(10,10,11,0.94);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }
  .nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 8px 0 4px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    color: var(--text-3);
    transition: color .2s var(--ease);
    position: relative;
  }
  .nav-item svg { width: 21px; height: 21px; }
  .nav-item:active { opacity: 0.7; }
  .nav-item::after { transition: opacity .2s var(--ease); opacity: 0; }
  .nav-item.active::after { opacity: 1; }
  .nav-item span { font-size: 11px; font-weight: 500; }
  .nav-item.active { color: var(--text); }
  .nav-item.active::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .nav-item:not(.active)::after { content: ""; position: absolute; bottom: -3px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

  /* ---------- десктоп: финальные переопределения (в конце, чтобы не перекрывались базовыми стилями) ---------- */
  @media (min-width: 900px) {
    .content { padding: 44px 48px 72px; }
    .topbar { padding-top: 0; justify-content: flex-end; }
    .topbar .brand { display: none; }
    .profile {
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 12px 0 30px;
    }
    .avatar-wrap { margin-bottom: 0; }
    .avatar { width: 56px; height: 56px; font-size: 20px; }
    .profile-meta { align-items: flex-start; }
    .trust { margin: 0 0 0 auto; }
    .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick { max-width: 480px; }
    .icon-btn.desktop-extra { display: flex; }
  }
</style>
</head>
<body>
<div class="app">

<script>
  // TRUST: цвет зависит от репутации (>=50 зелёный, 0..49 жёлтый, <0 красный)
  const repScore = 148;
  const badge = document.getElementById('trustBadge');
  const level = repScore >= 50 ? 'green' : repScore >= 0 ? 'yellow' : 'red';
  badge.classList.remove('trust--green', 'trust--yellow', 'trust--red');
  badge.classList.add('trust--' + level);
  badge.querySelector('.t-score').textContent = (repScore >= 0 ? '+' : '−') + Math.abs(repScore);

  // сворачивание сайдбара по клику на пин (десктоп)
  const sidebar = document.querySelector('.sidebar');
  const pinBtn = document.querySelector('.side-pin');
  if (pinBtn) pinBtn.addEventListener('click', () => sidebar.classList.toggle('pinned'));

  // переключение вкладок: синхронно для нижней навигации (мобайл) и сайдбара (десктоп)
  function setTab(tab) {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    moveGlider();
  }
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  // скользящая подложка активного пункта меню (десктоп)
  const sideNav = document.querySelector('.side-nav');
  const glider = document.createElement('div');
  glider.className = 'side-glider';
  sideNav.prepend(glider);

  function moveGlider() {
    const active = sideNav.querySelector('.side-item.active');
    if (!active) return;
    glider.style.height = active.offsetHeight + 'px';
    glider.style.transform = 'translateY(' + active.offsetTop + 'px)';
  }
  // стартовая позиция и пересчёт при ресайзе / сворачивании
  window.addEventListener('load', moveGlider);
  window.addEventListener('resize', moveGlider);
  if (pinBtn) pinBtn.addEventListener('click', () => setTimeout(moveGlider, 50));
</script>
</body>
</html>

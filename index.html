<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>
<style>
  :root {
    --text: #2C2C2B;
    --text-secondary: #7D7A75;
    --canvas: #FFFFFF;
    --surface: #F9F8F7;
    --surface-2: #F0EFED;
    --border: #E6E5E3;
    --accent: #2783DE;
    --accent-hover: #1B6FC9;
    --telegram: #2AABEE;
    --telegram-hover: #229ED9;
    --error: #E56458;
    --success: #46A171;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --canvas: #191919;
      --surface: #202020;
      --surface-2: #383836;
      --border: rgba(255, 255, 255, 0.20);
      --accent: #5E9FE8;
      --accent-hover: #7AB1EC;
      --error: #E97366;
      --success: #72BC8F;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background: var(--canvas);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 32px;
    text-align: center;
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .logo svg {
    width: 20px;
    height: 20px;
    fill: #FFFFFF;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: #FFFFFF;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn:hover {
    background: var(--accent-hover);
  }

  .btn:focus-visible,
  .btn-social:focus-visible,
  input:focus-visible,
  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-block {
    width: 100%;
  }

  /* --- Способы входа --- */
  .social {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 44px;
    padding: 0 16px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .btn-social svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .btn-telegram {
    background: var(--telegram);
    border: 1px solid var(--telegram);
    color: #FFFFFF;
  }

  .btn-telegram:hover {
    background: var(--telegram-hover);
    border-color: var(--telegram-hover);
  }

  .btn-telegram svg {
    fill: #FFFFFF;
  }

  /* Контейнер официального виджета Telegram Login */
  .telegram-widget {
    display: flex;
    justify-content: center;
    min-height: 40px;
  }

  .telegram-widget iframe {
    border-radius: 8px;
    overflow: hidden;
  }

  .btn-google {
    background: var(--canvas);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-google:hover {
    background: var(--surface-2);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* --- Форма входа по email --- */
  .field {
    text-align: left;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  input::placeholder {
    color: var(--text-secondary);
  }

  .message {
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-secondary);
    min-height: 20px;
  }

  .message.error {
    color: var(--error);
  }

  .message.success {
    color: var(--success);
  }

  .link {
    display: inline-block;
    margin-top: 12px;
    font-size: 14px;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .link:hover {
    color: var(--text);
  }

  /* --- Профиль после входа --- */
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 16px;
    display: block;
  }

  .avatar-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 26px;
    font-weight: 700;
  }

  .profile-name {
    margin-bottom: 4px;
  }

  .profile-username {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 32px;
  }

  /* --- Переключение экранов --- */
  .view {
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .view { animation: none; }
    .btn, .btn-social { transition: none; }
  }

  /* --- Мобильная адаптация --- */
  @media (max-width: 420px) {
    body {
      padding: 16px;
    }

    .card {
      padding: 32px 20px;
    }

    h1 {
      font-size: 23px;
    }
  }
</style>
</head>
<body>

<main class="card">

  <!-- Экран приветствия -->
  <section class="view" id="view-welcome">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5L4.5 6 12 2.5 19.5 6 12 9.5zM2 17l10 5 10-5v-3l-10 5-10-5v3zm0-5l10 5 10-5V9l-10 5L2 9v3z"/></svg>
    </div>
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Это начало вашего нового сайта.<br>Войдите, чтобы продолжить.</p>
    <button class="btn" id="btn-login" type="button">Login</button>
  </section>

  <!-- Экран входа -->
  <section class="view" id="view-login" hidden>
    <h2>Вход</h2>

    <div class="social">
      <!-- Сюда подставляется официальная кнопка Telegram Login Widget,
           когда задан TELEGRAM_BOT_USERNAME -->
      <div class="telegram-widget" id="telegram-widget-container" hidden></div>

      <!-- Запасная кнопка (демо-режим, пока бот не настроен) -->
      <button class="btn-social btn-telegram" id="btn-telegram" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.04 15.31l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9L23.9 4.6c.31-1.43-.52-1.99-1.46-1.64L1.9 11.14c-1.4.54-1.38 1.32-.24 1.67l5.2 1.62L18.98 6.3c.57-.37 1.08-.17.66.2L9.04 15.31z"/></svg>
        Войти через Telegram
      </button>

      <button class="btn-social btn-google" id="btn-google" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Войти через Google
      </button>
    </div>

    <div class="divider" role="separator"><span>или по email</span></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" type="submit">Войти</button>
    </form>

    <p class="message" id="form-message" aria-live="polite"></p>
    <button class="link" id="btn-back" type="button">← Назад</button>
  </section>

  <!-- Экран профиля после входа через Telegram -->
  <section class="view" id="view-profile" hidden>
    <img class="avatar" id="profile-avatar" alt="Аватар пользователя" hidden>
    <div class="avatar avatar-placeholder" id="profile-avatar-placeholder" aria-hidden="true">?</div>
    <h2 class="profile-name" id="profile-name">Пользователь</h2>
    <p class="profile-username" id="profile-username"></p>
    <button class="btn" id="btn-logout" type="button">Выйти</button>
  </section>

</main>

<script>
  /* ================= НАСТРОЙКА TELEGRAM LOGIN =================
     1. В Telegram откройте @BotFather и создайте бота командой /newbot.
     2. Там же выполните /setdomain и укажите домен, на котором будет
        размещён этот сайт (виджет не работает с file:// и localhost).
     3. Впишите username бота в константу ниже и загрузите сайт на домен.
     4. После входа Telegram передаёт объект пользователя с полем hash —
        для продакшена проверяйте его на сервере (HMAC-SHA256 от данных,
        ключ — SHA256 токена бота). Не вставляйте токен бота в этот файл!
  ============================================================ */
  const TELEGRAM_BOT_USERNAME = 'AstraletedSMS_bot'; // например: 'my_site_login_bot'

  const viewWelcome = document.getElementById('view-welcome');
  const viewLogin = document.getElementById('view-login');
  const viewProfile = document.getElementById('view-profile');
  const btnLogin = document.getElementById('btn-login');
  const btnBack = document.getElementById('btn-back');
  const btnTelegram = document.getElementById('btn-telegram');
  const btnGoogle = document.getElementById('btn-google');
  const btnLogout = document.getElementById('btn-logout');
  const widgetContainer = document.getElementById('telegram-widget-container');
  const form = document.getElementById('login-form');
  const message = document.getElementById('form-message');
  const profileAvatar = document.getElementById('profile-avatar');
  const avatarPlaceholder = document.getElementById('profile-avatar-placeholder');
  const profileName = document.getElementById('profile-name');
  const profileUsername = document.getElementById('profile-username');

  /* --- Сессия в localStorage --- */
  const session = {
    KEY: 'tg_user',
    load() {
      try { return JSON.parse(localStorage.getItem(this.KEY)); }
      catch { return null; }
    },
    save(user) { localStorage.setItem(this.KEY, JSON.stringify(user)); },
    clear() { localStorage.removeItem(this.KEY); }
  };

  function setMessage(text, type) {
    message.textContent = text;
    message.className = 'message' + (type ? ' ' + type : '');
  }

  function showView(view) {
    viewWelcome.hidden = view !== 'welcome';
    viewLogin.hidden = view !== 'login';
    viewProfile.hidden = view !== 'profile';
    if (view === 'login') {
      setMessage('', null);
      initTelegramWidget();
      document.getElementById('email').focus();
    } else if (view === 'profile') {
      btnLogout.focus();
    } else {
      btnLogin.focus();
    }
  }

  /* --- Официальный Telegram Login Widget --- */
  let widgetInited = false;

  function initTelegramWidget() {
    if (widgetInited || !TELEGRAM_BOT_USERNAME) return;
    widgetInited = true;

    btnTelegram.hidden = true;
    widgetContainer.hidden = false;

    const script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.async = true;
    script.setAttribute('data-telegram-login', TELEGRAM_BOT_USERNAME);
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-radius', '8');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    script.onerror = () => {
      widgetContainer.hidden = true;
      btnTelegram.hidden = false;
      setMessage('Не удалось загрузить виджет Telegram. Проверьте домен и интернет.', 'error');
    };
    widgetContainer.appendChild(script);
  }

  // Колбэк официального виджета после успешной авторизации
  window.onTelegramAuth = function(user) {
    // user = { id, first_name, last_name, username, photo_url, auth_date, hash }
    session.save(user);
    showProfile(user);
  };

  function showProfile(user) {
    const name = [user.first_name, user.last_name].filter(Boolean).join(' ');
    profileName.textContent = name || 'Пользователь Telegram';
    profileUsername.textContent = user.username ? '@' + user.username : 'id: ' + user.id;

    if (user.photo_url) {
      profileAvatar.src = user.photo_url;
      profileAvatar.hidden = false;
      avatarPlaceholder.hidden = true;
    } else {
      profileAvatar.hidden = true;
      avatarPlaceholder.hidden = false;
      avatarPlaceholder.textContent = (user.first_name || 'U').charAt(0).toUpperCase();
    }
    showView('profile');
  }

  /* --- Обработчики --- */
  btnLogin.addEventListener('click', () => {
    const user = session.load();
    if (user) showProfile(user);
    else showView('login');
  });

  btnBack.addEventListener('click', () => showView('welcome'));

  btnLogout.addEventListener('click', () => {
    session.clear();
    showView('welcome');
  });

  // Демо-режим, пока бот не настроен
  btnTelegram.addEventListener('click', () => {
    setMessage('Виджет Telegram не настроен: укажите имя бота в TELEGRAM_BOT_USERNAME (см. комментарий в коде).', null);
  });

  btnGoogle.addEventListener('click', () => {
    setMessage('Вход через Google появится на следующем шаге.', null);
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const email = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
      setMessage('Заполните email и пароль.', 'error');
      return;
    }

    // Демо-режим: реального сервера пока нет
    setMessage('Готово! Авторизация появится на следующем шаге.', 'success');
  });
</script>

</body>
</html>
